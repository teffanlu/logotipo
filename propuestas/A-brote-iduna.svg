<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600">
  <rect width="520" height="600" fill="#F5F1E9"/>
  <!-- ISOTIPO: la "i" de Iduna; la gota/hoja como punto = renovacion -->
  <g>
    <!-- hoja-gota (terracota) -->
    <path d="M260 150 C234 184 234 216 260 244 C286 216 286 184 260 150 Z" fill="#A45A41"/>
    <!-- nervadura sutil (negativo en crema) -->
    <path d="M260 178 L260 232" stroke="#F5F1E9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- tallo elegante (charcoal) -->
    <path d="M260 266 C258 302 258 332 260 366" fill="none" stroke="#2D2D2D" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- WORDMARK estilo Skin Lab -->
  <text x="252" y="452" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="60" font-weight="500" letter-spacing="16" fill="#2D2D2D">IDUNA</text>
  <text x="258" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="11" fill="#A45A41">SKIN SYSTEM</text>
</svg>
